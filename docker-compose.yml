services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-risk-ifrs9:latest
    container_name: credit-risk-pipeline
    volumes:
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
    command: dvc repro

  api:
    image: credit-risk-ifrs9:latest
    container_name: credit-risk-api
    volumes:
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
    command: uvicorn credit_risk_graph.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  mlflow:
    image: credit-risk-ifrs9:latest
    container_name: credit-risk-mlflow
    volumes:
      - .:/app
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      MLFLOW_SERVER_ALLOWED_HOSTS: localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
    command: >-
      sh -c "mkdir -p /app/mlruns/artifacts &&
      mlflow server
      --backend-store-uri sqlite:////app/mlruns/mlflow.db
      --default-artifact-root /app/mlruns/artifacts
      --host 0.0.0.0
      --port 5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: credit-risk-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: credit-risk-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    ports:
      - "3000:3000"
