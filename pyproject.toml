[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-graph-ifrs9"
version = "0.1.0"
description = "IFRS 9 credit scoring platform with graph-aware enrichment and explainable decision support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dvc>=3.50.0",
  "fastapi>=0.115.0",
  "interpret>=0.7.0",
  "joblib>=1.4.2",
  "lightgbm>=4.5.0",
  "matplotlib>=3.9.2",
  "mlflow>=2.16.2",
  "networkx>=3.3",
  "nbclient>=0.10.2",
  "nbformat>=5.10.4",
  "numpy>=2.1.1",
  "orjson>=3.10.7",
  "pandas>=2.2.2,<3",
  "prometheus-client>=0.21.0",
  "pyarrow>=17.0.0",
  "pydantic>=2.9.2",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.2",
  "scipy>=1.14.1",
  "seaborn>=0.13.2",
  "ipykernel>=6.29.5",
  "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
